---
name: Prowler CLI
version: '1.0'
one-apps_version: 7.0.0-0
publisher: OpenNebula Community
publisher_email: community@opennebula.io
description: |-
  [Prowler](https://github.com/prowler-cloud/prowler) is the most widely used
  open-source cloud security and compliance scanner. This appliance ships the
  [Prowler CLI](https://docs.prowler.com/projects/prowler-open-source/en/latest/)
  on a hardened Ubuntu 24.04 LTS bastion, ready to audit AWS, Azure, GCP,
  Kubernetes and Microsoft 365 from a single VM.

  Prowler runs more than 500 controls mapped to frameworks like CIS, NIST,
  PCI-DSS, HIPAA, GDPR, SOC2, FedRAMP and the Spanish ENS, and exports
  findings as HTML, CSV, JSON, OCSF or ASFF. Cloud credentials are injected
  at instantiation through OpenNebula contextualization (no secrets baked
  into the image), and a systemd timer runs a daily scan out of the box.

  SSH in as `prowler` and run `prowler-scan <aws|azure|gcp|kubernetes|m365>`
  to launch an on-demand audit. Provide a
  [Prowler Cloud](https://cloud.prowler.com) API key from the instantiation
  wizard to push results to the central dashboard, or keep everything local
  on the VM.
short_description: >-
  Open-source multi-cloud security and compliance scanner for AWS, Azure,
  GCP, Kubernetes and Microsoft 365.
tags:
- prowler
- security
- compliance
- cloud-security
- bastion
- aws
- azure
- gcp
- kubernetes
- ubuntu
- service
format: qcow2
creation_time: 1771455600
os-id: Ubuntu
os-release: '24.04 LTS'
os-arch: x86_64
hypervisor: KVM
opennebula_version: 6.10, 7.0
opennebula_template:
  context:
    network: 'YES'
    token: 'YES'
    report_ready: 'YES'
    set_hostname: "$NAME"
    ssh_public_key: "$USER[SSH_PUBLIC_KEY]"
    oneapp_prowler_scan_token: "$ONEAPP_PROWLER_SCAN_TOKEN"
  cpu: '1'
  vcpu: '1'
  graphics:
    listen: 0.0.0.0
    type: vnc
  memory: '1024'
  os:
    arch: x86_64
  user_inputs:
    oneapp_prowler_scan_token: "O|password|Prowler Cloud API key (optional)"
  inputs_order: >-
    ONEAPP_PROWLER_SCAN_TOKEN
  user_inputs_metadata:
  - name: PROWLER
    type: APP
    title: Prowler
  - name: SCAN
    type: GROUP
    title: Optional integrations
    description: Push scan results to cloud.prowler.com (optional).
