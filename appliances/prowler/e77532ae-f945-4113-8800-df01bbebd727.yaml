name: Service Prowler
version: 1.0.0-2
one-apps_version: 7.0.0-0
publisher: OpenNebula Community
publisher_email: community@opennebula.io
description: |-
  [Prowler](https://github.com/prowler-cloud/prowler) is the most widely
  used open-source cloud security platform. This appliance ships the
  upstream **Prowler CLI** on a bastion-hardened Ubuntu 24.04 base,
  intended for automated multi-cloud security and compliance scanning.

  **Capabilities**
  - 500+ security checks for AWS, Azure, GCP, Kubernetes, and Microsoft 365
  - Compliance frameworks: CIS, NIST 800-53, NIST CSF, PCI-DSS, HIPAA,
    GDPR, SOC2, FedRAMP, ENS (Spanish National Security Scheme), and more
  - HTML / CSV / JSON / OCSF / ASFF report output
  - Recurring scans via a systemd timer (default: daily 03:00)

  **What is included**
  - Ubuntu 24.04 LTS (server, minimal package set)
  - Prowler CLI installed via pipx for the non-root `prowler` user
  - `prowler-scan` and `prowler-status` helper commands
  - Systemd `prowler-scan.timer` for periodic scans
  - Cloud-provider credentials injected at instantiation via OpenNebula
    contextualization (no credentials baked into the image)
  - Optional **Prowler Cloud / Prowler App** integration: when a SaaS API
    key is provided via `ONEAPP_PROWLER_SCAN_TOKEN`, every scan is
    pushed to `https://api.prowler.com/api/v1/ingestions` (or to a
    self-hosted Prowler App via `ONEAPP_PROWLER_CLOUD_API_BASE_URL`) so
    findings appear in the central dashboard

  **Bastion hardening applied by default**
  - Non-root default user `prowler` (UID 1000, NOPASSWD sudo)
  - Root account locked, `PermitRootLogin no`
  - SSH key-only auth, `AllowUsers prowler`, `MaxAuthTries 3`
  - UFW firewall: deny incoming, allow 22/tcp only
  - fail2ban watching sshd
  - Unattended security upgrades enabled
  - Kernel sysctl hardening (rp_filter, kptr_restrict, ptrace_scope, ...)
  - auditd with CIS-aligned identity / sudo / sshd watches
  - Password policy via pam_pwquality (minlen 14, three character classes)

  **Documentation**
  - [Prowler CLI docs](https://docs.prowler.com/projects/prowler-open-source/en/latest/)
  - [Prowler GitHub](https://github.com/prowler-cloud/prowler)
  - [Appliance README](https://github.com/OpenNebula/marketplace-community/blob/master/appliances/prowler/README.md)

short_description: Prowler cloud security CLI on a hardened Ubuntu 24.04 base
